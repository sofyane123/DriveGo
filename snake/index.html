<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f172a"><title>لعبة الدودة</title><style>:root{--bg:#0f172a;--panel:#111827;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--green2:#4ade80;--red:#ef4444;--cell:#172033}*{box-sizing:border-box;touch-action:manipulation}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#16324b,var(--bg) 55%);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:var(--text);padding:14px}.app{width:min(96vw,520px);background:rgba(17,24,39,.96);border:1px solid #ffffff18;border-radius:24px;padding:16px;box-shadow:0 25px 70px #0008}h1{margin:0;text-align:center;font-size:2rem}.sub{text-align:center;color:var(--muted);margin:4px 0 12px}.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.card{background:#0b1220;border-radius:14px;padding:10px;text-align:center}.card small{display:block;color:var(--muted)}.card strong{font-size:1.4rem}canvas{width:100%;aspect-ratio:1;background:#07111f;border:1px solid #ffffff18;border-radius:18px;display:block}.status{text-align:center;min-height:24px;margin:10px 0;font-weight:700}.controls{width:210px;margin:8px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls button,.action{border:0;border-radius:14px;background:#233047;color:white;font-size:24px;font-weight:800;padding:13px;box-shadow:inset 0 0 0 1px #ffffff12}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.action{font-size:15px}.primary{background:linear-gradient(135deg,#16a34a,#0ea5e9)}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}@media(min-width:700px){.controls{display:none}}</style></head><body><main class="app"><h1>🐍 لعبة الدودة</h1><div class="sub">كُل التفاح وكبّر الدودة بدون أن تصطدم</div><section class="top"><div class="card"><small>النقاط</small><strong id="score">0</strong></div><div class="card"><small>أفضل نتيجة</small><strong id="best">0</strong></div></section><canvas id="game" width="400" height="400"></canvas><div class="status" id="status">اضغط ابدأ</div><div class="controls"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><div class="actions"><button class="action primary" id="start">ابدأ / إعادة</button><button class="action" id="pause">إيقاف مؤقت</button></div><div class="hint">على الكمبيوتر استخدم الأسهم. على الهاتف استخدم الأزرار أو اسحب بإصبعك.</div></main><script>const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');const size=20,tile=c.width/size;let snake,food,dir,nextDir,score,timer,running=false,paused=false,speed=150;let best=Number(localStorage.getItem('snakeBest')||0);bestEl.textContent=best;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;speed=150;scoreEl.textContent=0;placeFood();draw()}function placeFood(){do{food={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}function draw(){x.fillStyle='#07111f';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#102138';x.lineWidth=1;for(let i=1;i<size;i++){x.beginPath();x.moveTo(i*tile,0);x.lineTo(i*tile,c.height);x.stroke();x.beginPath();x.moveTo(0,i*tile);x.lineTo(c.width,i*tile);x.stroke()}x.fillStyle='#ef4444';x.beginPath();x.arc(food.x*tile+tile/2,food.y*tile+tile/2,tile*.33,0,Math.PI*2);x.fill();snake.forEach((s,i)=>{x.fillStyle=i===0?'#4ade80':'#22c55e';x.fillRect(s.x*tile+2,s.y*tile+2,tile-4,tile-4)});if(paused){x.fillStyle='#0009';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.textAlign='center';x.font='bold 30px system-ui';x.fillText('متوقف مؤقتًا',c.width/2,c.height/2)}}function tick(){if(!running||paused)return;dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=size||h.y>=size||snake.some(s=>s.x===h.x&&s.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem('snakeBest',best);bestEl.textContent=best}if(score%4===0&&speed>65){speed-=10;clearInterval(timer);timer=setInterval(tick,speed)}placeFood()}else snake.pop();draw()}function start(){clearInterval(timer);reset();running=true;paused=false;statusEl.textContent='العب الآن 🐍';timer=setInterval(tick,speed)}function gameOver(){running=false;clearInterval(timer);statusEl.textContent='انتهت اللعبة — نتيجتك '+score;draw();x.fillStyle='#0009';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.textAlign='center';x.font='bold 31px system-ui';x.fillText('انتهت اللعبة',c.width/2,c.height/2-8);x.font='20px system-ui';x.fillText('النقاط: '+score,c.width/2,c.height/2+28)}function setDir(n){if(!running)return;const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d}document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();setDir(m)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDir(b.dataset.d));document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;statusEl.textContent=paused?'متوقف مؤقتًا':'العب الآن 🐍';draw()};let sx=0,sy=0;c.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:true});reset()</script></body></html>
