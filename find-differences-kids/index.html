<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكتشف الاختلافات</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:linear-gradient(#bde7ff,#fff7d6);color:#17324d;min-height:100vh;padding:14px}.wrap{max-width:920px;margin:auto}.top{text-align:center;background:#ffffffd9;border-radius:24px;padding:14px;box-shadow:0 8px 25px #0002}.top h1{margin:0;font-size:clamp(26px,6vw,42px)}.top p{margin:6px 0 0;font-size:18px}.score{display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}.pill{background:#fff;border-radius:999px;padding:9px 16px;font-weight:800}.game{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.scene{position:relative;aspect-ratio:4/3;background:linear-gradient(#83d6ff 0 58%,#7bd66a 58%);border:5px solid #fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #0002}.sun,.tree,.cloud,.house,.flower,.bird,.ball,.cat{position:absolute;user-select:none}.sun{font-size:12vw;max-font-size:80px;left:5%;top:4%}.cloud{font-size:9vw;right:7%;top:8%}.tree{font-size:14vw;left:9%;bottom:15%}.house{font-size:13vw;right:8%;bottom:15%}.flower{font-size:6vw;left:42%;bottom:8%}.bird{font-size:5vw;left:48%;top:22%}.ball{font-size:6vw;right:36%;bottom:7%}.cat{font-size:6vw;right:22%;bottom:5%}.tap{cursor:pointer;transition:.2s}.tap:active{transform:scale(.9)}.found{filter:drop-shadow(0 0 8px #ffcf00);outline:4px solid #ffd400;border-radius:50%}.hint{text-align:center;margin:14px 0;background:#fff;padding:12px;border-radius:18px;font-size:18px;font-weight:700}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{border:0;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;background:#6c5ce7;color:white;box-shadow:0 6px 0 #4b3bb8}.actions button:active{transform:translateY(3px);box-shadow:0 3px 0 #4b3bb8}.msg{margin-top:12px;text-align:center;font-size:24px;font-weight:900;min-height:34px}.spark{position:fixed;pointer-events:none;font-size:26px;animation:pop .8s ease-out forwards}@keyframes pop{to{transform:translateY(-70px) scale(1.8);opacity:0}}@media(max-width:650px){.game{grid-template-columns:1fr}.scene{aspect-ratio:4/3}.sun{font-size:17vw}.cloud{font-size:14vw}.tree{font-size:20vw}.house{font-size:19vw}.flower,.ball,.cat{font-size:9vw}.bird{font-size:8vw}}</style></head><body><div class="wrap"><div class="top"><h1>🔎 اكتشف الاختلافات</h1><p>ابحث عن <b>3 اختلافات</b> واضغط عليها في الصورة الثانية</p><div class="score"><div class="pill">⭐ وجدت: <span id="foundCount">0</span>/3</div><div class="pill">🏆 النقاط: <span id="score">0</span></div></div></div><div class="game"><div class="scene" aria-label="الصورة الأولى"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="tree">🌳</div><div class="house">🏠</div><div class="flower">🌼</div><div class="bird">🐦</div><div class="ball">⚽</div><div class="cat">🐱</div></div><div class="scene" aria-label="الصورة الثانية" id="rightScene"><div class="sun">🌙</div><div class="cloud">☁️</div><div class="tree">🌳</div><div class="house">🏠</div><div class="flower tap" data-diff="flower">🌷</div><div class="bird tap" data-diff="bird">🦋</div><div class="ball tap" data-diff="ball">🏀</div><div class="cat">🐱</div></div></div><div class="hint" id="hint">💡 اضغط على الشيء المختلف في الصورة الثانية</div><div class="actions"><button id="help">👀 مساعدة</button><button id="reset">🔄 من جديد</button></div><div class="msg" id="msg"></div></div><script>const diffs=[...document.querySelectorAll('[data-diff]')],fc=document.getElementById('foundCount'),sc=document.getElementById('score'),msg=document.getElementById('msg'),hint=document.getElementById('hint');let found=new Set(),score=0;function sparkle(x,y){for(let i=0;i<8;i++){const s=document.createElement('div');s.className='spark';s.textContent=['⭐','✨','🎉'][Math.floor(Math.random()*3)];s.style.left=(x+(Math.random()*50-25))+'px';s.style.top=(y+(Math.random()*30-15))+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}diffs.forEach(el=>el.addEventListener('click',e=>{const id=el.dataset.diff;if(found.has(id))return;found.add(id);el.classList.add('found');score+=10;fc.textContent=found.size;sc.textContent=score;sparkle(e.clientX,e.clientY);msg.textContent='أحسنت! 🌟';if(found.size===3){msg.textContent='رائع جدًا! وجدت كل الاختلافات 🎉🏆';hint.textContent='👏 ممتاز! يمكنك اللعب من جديد.'}}));document.getElementById('help').onclick=()=>{const left=diffs.find(x=>!found.has(x.dataset.diff));if(!left){msg.textContent='وجدت كل شيء بالفعل! 🎉';return}left.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:700,iterations:2});hint.textContent='👀 انظر جيدًا إلى الشيء الذي تحرك!'};document.getElementById('reset').onclick=()=>{found.clear();score=0;fc.textContent='0';sc.textContent='0';msg.textContent='';hint.textContent='💡 اضغط على الشيء المختلف في الصورة الثانية';diffs.forEach(x=>x.classList.remove('found'))};</script></body></html>
