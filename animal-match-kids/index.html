<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7ed"><title>لعبة مطابقة الحيوانات</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#fff7ed,#fef3c7);min-height:100vh;color:#3f3f46;display:grid;place-items:center;padding:18px}.app{width:min(96vw,520px);background:#ffffffdd;border:3px solid #fde68a;border-radius:28px;padding:20px;box-shadow:0 20px 50px #0002}h1{text-align:center;margin:0;font-size:clamp(28px,8vw,42px)}.sub{text-align:center;font-size:18px;margin:6px 0 14px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.box{flex:1;background:#fff7ed;border-radius:18px;padding:10px;text-align:center;font-weight:800}.box strong{display:block;font-size:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:0;border-radius:20px;background:linear-gradient(145deg,#60a5fa,#8b5cf6);font-size:clamp(34px,11vw,60px);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 #5b21b6;transition:.15s}.card:active{transform:translateY(4px);box-shadow:0 2px 0 #5b21b6}.card.revealed,.card.matched{background:#fff;box-shadow:inset 0 0 0 4px #c4b5fd}.card.matched{background:#dcfce7;box-shadow:inset 0 0 0 4px #86efac}.msg{text-align:center;font-size:22px;font-weight:900;min-height:34px;margin:14px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.action{border:0;border-radius:18px;padding:14px;font-size:18px;font-weight:800;cursor:pointer}.new{background:#22c55e;color:white}.easy{background:#f59e0b;color:white}.stars{text-align:center;font-size:30px;min-height:38px;margin-top:8px}@media(max-width:420px){.grid{gap:8px}.app{padding:14px}.card{border-radius:16px}}</style></head><body><main class="app"><h1>🐶 طابق الحيوانات 🐱</h1><div class="sub">افتح بطاقتين وابحث عن الحيوان نفسه</div><div class="top"><div class="box">المحاولات<strong id="moves">0</strong></div><div class="box">الأزواج<strong id="pairs">0 / 6</strong></div></div><div class="msg" id="msg">ابدأ اللعب 🌟</div><section class="grid" id="grid"></section><div class="stars" id="stars"></div><div class="actions"><button class="action new" id="new">لعبة جديدة</button><button class="action easy" id="hint">مساعدة 👀</button></div></main><script>const animals=['🐶','🐱','🐰','🐼','🦁','🐸'];let deck=[],first=null,second=null,lock=false,moves=0,matched=0;const grid=document.getElementById('grid'),msg=document.getElementById('msg'),movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),stars=document.getElementById('stars');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){deck=shuffle([...animals,...animals]).map((v,i)=>({v,id:i,matched:false,revealed:false}));first=second=null;lock=false;moves=0;matched=0;stars.textContent='';msg.textContent='ابدأ اللعب 🌟';render()}function render(){grid.innerHTML='';deck.forEach((c,i)=>{const b=document.createElement('button');b.className='card'+(c.revealed?' revealed':'')+(c.matched?' matched':'');b.textContent=(c.revealed||c.matched)?c.v:'❓';b.onclick=()=>flip(i);grid.appendChild(b)});movesEl.textContent=moves;pairsEl.textContent=`${matched} / 6`}function flip(i){if(lock||deck[i].matched||deck[i].revealed)return;deck[i].revealed=true;if(first===null){first=i;msg.textContent='اختر بطاقة ثانية 👀';render();return}second=i;moves++;if(deck[first].v===deck[second].v){deck[first].matched=deck[second].matched=true;matched++;msg.textContent='أحسنت! 🎉';first=second=null;if(matched===6){msg.textContent='ممتاز! فزت! 🏆';stars.textContent='⭐⭐⭐⭐⭐'}render()}else{lock=true;msg.textContent='حاول مرة أخرى 😊';render();setTimeout(()=>{deck[first].revealed=false;deck[second].revealed=false;first=second=null;lock=false;msg.textContent='تابع اللعب 🌈';render()},850)}}function hint(){if(lock)return;deck.forEach(c=>{if(!c.matched)c.revealed=true});render();msg.textContent='شاهد جيدًا 👀';setTimeout(()=>{deck.forEach(c=>{if(!c.matched)c.revealed=false});first=second=null;msg.textContent='الآن جرّب بنفسك 🌟';render()},1400)}document.getElementById('new').onclick=start;document.getElementById('hint').onclick=hint;start()</script></body></html>
