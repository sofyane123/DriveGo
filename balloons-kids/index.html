<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#7dd3fc"><title>لعبة فرقع البالونات</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:linear-gradient(#7dd3fc,#dbeafe 55%,#bbf7d0);min-height:100vh;overflow:hidden;color:#0f172a}.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);box-shadow:0 4px 16px #0002}.score,.best{font-size:18px;font-weight:900}.title{font-size:20px;font-weight:900}.game{position:fixed;inset:64px 0 0;overflow:hidden}.balloon{position:absolute;width:84px;height:104px;border:0;border-radius:50% 50% 46% 46%;box-shadow:inset -10px -14px 0 #0001,0 10px 18px #0002;cursor:pointer;touch-action:manipulation;animation:floatUp linear forwards}.balloon:after{content:"";position:absolute;bottom:-22px;left:50%;width:2px;height:28px;background:#64748b;transform:translateX(-50%)}.balloon:before{content:"";position:absolute;bottom:-6px;left:50%;width:14px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg)}@keyframes floatUp{from{transform:translateY(0)}to{transform:translateY(-120vh)}}.pop{animation:pop .22s ease-out forwards!important}@keyframes pop{to{transform:scale(1.8);opacity:0}}.star{position:absolute;font-size:42px;pointer-events:none;animation:star .7s ease-out forwards}@keyframes star{from{transform:scale(.5);opacity:1}to{transform:translateY(-70px) scale(1.5) rotate(25deg);opacity:0}}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(4px)}.card{width:min(90vw,380px);background:white;border-radius:28px;padding:26px;text-align:center;box-shadow:0 20px 60px #0003}.emoji{font-size:72px}.card h1{margin:8px 0;font-size:30px}.card p{font-size:18px;line-height:1.7}.play{border:0;border-radius:18px;padding:16px 28px;font-size:24px;font-weight:900;background:#22c55e;color:#fff;box-shadow:0 8px 0 #15803d;cursor:pointer}.play:active{transform:translateY(4px);box-shadow:0 4px 0 #15803d}.reward{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#0004}.reward .box{background:#fff;border-radius:30px;padding:28px;text-align:center;font-size:28px;font-weight:900;box-shadow:0 20px 60px #0004}.reward .big{font-size:90px;display:block}.smallbtn{margin-top:14px;border:0;border-radius:14px;padding:12px 20px;font-size:20px;font-weight:800;background:#3b82f6;color:white}@media(max-width:420px){.balloon{width:74px;height:92px}.title{font-size:17px}.score,.best{font-size:16px}}</style></head><body><div class="top"><div class="score">⭐ <span id="score">0</span></div><div class="title">🎈 فرقع البالونات</div><div class="best">🏆 <span id="best">0</span></div></div><main class="game" id="game"></main><div class="start" id="start"><div class="card"><div class="emoji">🎈✨</div><h1>فرقع البالونات!</h1><p>اضغط على البالونات واجمع النجوم ⭐<br>لا يوجد خسارة، فقط متعة!</p><button class="play" id="play">ابدأ اللعب</button></div></div><div class="reward" id="reward"><div class="box"><span class="big">🌟</span>أحسنت!<br><span id="rewardText">10 نجوم!</span><br><button class="smallbtn" id="continue">تابع اللعب</button></div></div><script>const game=document.getElementById('game'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),start=document.getElementById('start'),reward=document.getElementById('reward');let score=0,best=+localStorage.getItem('balloonBest')||0,running=false,timer=null,nextReward=10;bestEl.textContent=best;const colors=['#fb7185','#f97316','#facc15','#4ade80','#22d3ee','#60a5fa','#a78bfa','#f472b6'];function spawn(){if(!running)return;const b=document.createElement('button');b.className='balloon';b.style.background=colors[Math.floor(Math.random()*colors.length)];b.style.left=Math.random()*Math.max(10,window.innerWidth-95)+'px';b.style.bottom='-120px';b.style.animationDuration=(4.8+Math.random()*2.8)+'s';b.setAttribute('aria-label','بالون');b.onclick=e=>popBalloon(b,e);game.appendChild(b);setTimeout(()=>b.remove(),8000)}function popBalloon(b,e){if(!running||b.classList.contains('pop'))return;score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('balloonBest',best)}const s=document.createElement('div');s.className='star';s.textContent='⭐';const r=b.getBoundingClientRect();s.style.left=(r.left+r.width/2-20)+'px';s.style.top=(r.top+r.height/2-20)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),800);b.classList.add('pop');setTimeout(()=>b.remove(),220);beep();if(score>=nextReward){running=false;clearInterval(timer);document.getElementById('rewardText').textContent=score+' نجوم!';reward.style.display='grid';nextReward+=10}}function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=650+Math.random()*250;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.12)}catch(e){}}function begin(){start.style.display='none';reward.style.display='none';running=true;clearInterval(timer);timer=setInterval(spawn,700);spawn()}document.getElementById('play').onclick=begin;document.getElementById('continue').onclick=begin;</script></body></html>
