<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>X/O Robot</title><style>:root{--bg:#0f172a;--panel:#111827;--cell:#1f2937;--text:#f8fafc;--muted:#94a3b8;--x:#38bdf8;--o:#f472b6;--win:#22c55e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top left,#12304a,var(--bg) 45%);color:var(--text);padding:20px}.app{width:min(94vw,480px);background:var(--panel);border:1px solid #ffffff16;border-radius:26px;padding:22px;box-shadow:0 24px 70px #0006}h1{text-align:center;margin:0}.sub{text-align:center;color:var(--muted);margin:5px 0 16px}label{font-size:13px;color:var(--muted)}select,button{width:100%;border:1px solid #ffffff16;border-radius:14px;background:#0b1220;color:var(--text);padding:12px;font-size:15px}select{margin-top:5px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.card{text-align:center;background:#0b1220;border-radius:15px;padding:10px}.card small{display:block;color:var(--muted)}.card strong{font-size:22px}.status{text-align:center;font-weight:800;min-height:28px;margin:10px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;background:var(--cell);font-size:clamp(42px,15vw,72px);font-weight:900;padding:0}.cell.x{color:var(--x)}.cell.o{color:var(--o)}.cell.win{outline:3px solid var(--win)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.primary{background:linear-gradient(135deg,#0284c7,#7c3aed);font-weight:800}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}</style></head><body><main class="app"><h1>X/O Robot</h1><div class="sub">You are X · Robot is O</div><label>Robot difficulty<select id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><section class="score"><div class="card"><small>You</small><strong id="ps">0</strong></div><div class="card"><small>Draws</small><strong id="ds">0</strong></div><div class="card"><small>Robot</small><strong id="rs">0</strong></div></section><div class="status" id="status">Your turn</div><section class="board" id="board"></section><div class="actions"><button class="primary" id="new">New Round</button><button id="reset">Reset Score</button></div><div class="hint">Hard mode uses optimal play.</div></main><script>const B=document.getElementById('board'),S=document.getElementById('status'),L=document.getElementById('level'),P=document.getElementById('ps'),R=document.getElementById('rs'),D=document.getElementById('ds'),W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b=Array(9).fill(''),over=false,thinking=false,score={p:0,r:0,d:0},winning=[];function result(a){for(const c of W){if(a[c[0]]&&a[c[0]]===a[c[1]]&&a[c[0]]===a[c[2]])return{w:a[c[0]],c}}return a.every(Boolean)?{w:'d',c:[]}:null}function render(){B.innerHTML='';b.forEach((v,i)=>{let x=document.createElement('button');x.className='cell '+(v?v.toLowerCase():'')+(winning.includes(i)?' win':'');x.textContent=v;x.disabled=!!v||over||thinking;x.onclick=()=>play(i);B.appendChild(x)});P.textContent=score.p;R.textContent=score.r;D.textContent=score.d}function finish(q){over=true;thinking=false;winning=q.c;if(q.w==='X'){score.p++;S.textContent='You win! 🎉'}else if(q.w==='O'){score.r++;S.textContent='Robot wins 🤖'}else{score.d++;S.textContent='Draw 🤝'}render()}function play(i){if(b[i]||over||thinking)return;b[i]='X';render();let q=result(b);if(q)return finish(q);thinking=true;S.textContent='Robot is thinking...';render();setTimeout(robot,300)}function random(a){let f=a.map((v,i)=>v?null:i).filter(v=>v!==null);return f[Math.floor(Math.random()*f.length)]}function best(a){let bs=-Infinity,m=null;for(let i=0;i<9;i++)if(!a[i]){a[i]='O';let s=mini(a,0,false);a[i]='';if(s>bs){bs=s;m=i}}return m}function mini(a,d,max){let q=result(a);if(q)return q.w==='O'?10-d:q.w==='X'?d-10:0;let z=max?-Infinity:Infinity;for(let i=0;i<9;i++)if(!a[i]){a[i]=max?'O':'X';let s=mini(a,d+1,!max);a[i]='';z=max?Math.max(z,s):Math.min(z,s)}return z}function robot(){let m=L.value==='easy'?random(b):L.value==='medium'?(Math.random()<.65?best(b):random(b)):best(b);if(m!=null)b[m]='O';thinking=false;let q=result(b);if(q)return finish(q);S.textContent='Your turn';render()}function fresh(){b=Array(9).fill('');over=false;thinking=false;winning=[];S.textContent='Your turn';render()}document.getElementById('new').onclick=fresh;document.getElementById('reset').onclick=()=>{score={p:0,r:0,d:0};fresh()};L.onchange=fresh;render()</script></body></html>
