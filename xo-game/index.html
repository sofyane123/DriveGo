<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>X/O Game</title>
  <style>
    :root{--bg:#0f172a;--panel:#111827;--cell:#1f2937;--text:#f8fafc;--muted:#94a3b8;--accent:#22c55e;--x:#38bdf8;--o:#fb923c}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#1e293b,var(--bg) 55%);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,430px);background:rgba(17,24,39,.96);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{text-align:center;margin:0;font-size:2rem}.sub{text-align:center;color:var(--muted);margin:6px 0 18px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score-card{background:#0b1220;border-radius:14px;padding:10px;text-align:center}.score-card strong{display:block;font-size:1.3rem}.x{color:var(--x)}.o{color:var(--o)}#status{text-align:center;font-weight:800;margin:16px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:0;border-radius:18px;background:var(--cell);font-size:clamp(2.8rem,15vw,5rem);font-weight:900;cursor:pointer;transition:.15s}.cell:hover{transform:translateY(-2px);background:#273449}.cell:disabled{cursor:default}.cell.x{color:var(--x)}.cell.o{color:var(--o)}.cell.win{outline:3px solid var(--accent);background:#163126}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.action{border:0;border-radius:14px;padding:13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#052e16}.secondary{background:#334155;color:#fff}@media(max-width:380px){.app{padding:16px}.score-card{font-size:.85rem}}
  </style>
</head>
<body>
  <main class="app">
    <h1>X / O</h1>
    <p class="sub">Tic-Tac-Toe</p>
    <section class="score">
      <div class="score-card"><span class="x">X Wins</span><strong id="xScore">0</strong></div>
      <div class="score-card"><span>Draws</span><strong id="dScore">0</strong></div>
      <div class="score-card"><span class="o">O Wins</span><strong id="oScore">0</strong></div>
    </section>
    <div id="status">X's turn</div>
    <section class="board" id="board"></section>
    <div class="actions">
      <button class="action primary" id="newRound">New Round</button>
      <button class="action secondary" id="resetScore">Reset Score</button>
    </div>
  </main>
  <script>
    const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),xScoreEl=document.getElementById('xScore'),oScoreEl=document.getElementById('oScore'),dScoreEl=document.getElementById('dScore');
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board=Array(9).fill(''),current='X',gameOver=false,scores={X:0,O:0,D:0},winning=[];
    function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v?' '+v.toLowerCase():'')+(winning.includes(i)?' win':'');b.textContent=v;b.disabled=!!v||gameOver;b.setAttribute('aria-label',`Cell ${i+1}${v?': '+v:''}`);b.onclick=()=>play(i);boardEl.appendChild(b)});xScoreEl.textContent=scores.X;oScoreEl.textContent=scores.O;dScoreEl.textContent=scores.D}
    function play(i){if(board[i]||gameOver)return;board[i]=current;const line=wins.find(l=>l.every(n=>board[n]===current));if(line){gameOver=true;winning=line;scores[current]++;statusEl.textContent=`${current} wins! 🎉`}else if(board.every(Boolean)){gameOver=true;scores.D++;statusEl.textContent='Draw! 🤝'}else{current=current==='X'?'O':'X';statusEl.textContent=`${current}'s turn`}render()}
    function newRound(){board=Array(9).fill('');current='X';gameOver=false;winning=[];statusEl.textContent="X's turn";render()}
    document.getElementById('newRound').onclick=newRound;document.getElementById('resetScore').onclick=()=>{scores={X:0,O:0,D:0};newRound()};render();
  </script>
</body>
</html>
